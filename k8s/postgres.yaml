apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pgdata
  namespace: football-oracle
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: football-oracle
spec:
  replicas: 1
  selector:
    matchLabels: { app: db }
  template:
    metadata:
      labels: { app: db }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - { name: POSTGRES_USER, value: litellm }
            - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: football-secrets, key: pg-password } } }
            - { name: POSTGRES_DB, value: litellm }
            # Azure Disk mounts contain lost+found, so initdb cannot use the
            # mount root. Keep the cluster in a subdirectory.
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          volumeMounts:
            - { name: pgdata, mountPath: /var/lib/postgresql/data }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
      volumes:
        - name: pgdata
          persistentVolumeClaim: { claimName: pgdata }
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: football-oracle
spec:
  selector: { app: db }
  ports:
    - { port: 5432 }
